[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wardogs-autopilot"
version = "0.1.0"
description = "Autopilot for WARDOGS supply runs: minimap capture, localization, Arduino-key driving."
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "numpy",
    "mss",
    "pyserial",
    "pydantic>=2.0",
    "pyside6>=6.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autopilot = ["../data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008", "UP031", "SIM105", "SIM115"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
files = ["src", "tests"]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "cv2",
    "cv2.*",
    "mss",
    "mss.*",
    "serial",
    "PIL",
]
ignore_missing_imports = true
